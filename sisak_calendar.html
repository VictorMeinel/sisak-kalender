<title>Sisak Sejlplan 2027</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
:root {
  --bg: #f2f5f8;
  --surface: #ffffff;
  --surface2: #f7f9fb;
  --fg: #0e1c2a;
  --fg-muted: #5a7080;
  --border: #dde4ea;
  --accent: #0f3d5c;
  --accent2: #1a6091;
  --accent-light: #e4eef5;
  --col-raw: #1e6fb5;   --col-raw-bg: #ddeaf8;   --col-raw-pill: #c5dcf4;
  --col-exp: #c4621a;   --col-exp-bg: #faeadb;   --col-exp-pill: #f5d5b8;
  --col-joe: #1e9459;   --col-joe-bg: #d5f0e3;   --col-joe-pill: #b3e5cc;
  --col-free: #e8f4ea;  --col-free-text: #2e7d32;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.06);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.16);
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08141f; --surface: #0f2030; --surface2: #0d1b2a;
    --fg: #dce9f2; --fg-muted: #7a9db5;
    --border: #1c3347; --accent: #5badda; --accent2: #3d8fc0; --accent-light: #0f2538;
    --col-raw: #5badda; --col-raw-bg: #0e2a3f; --col-raw-pill: #143a52;
    --col-exp: #d9895a; --col-exp-bg: #2c1a0a; --col-exp-pill: #3d2410;
    --col-joe: #4dc98a; --col-joe-bg: #0a2918; --col-joe-pill: #0e3521;
    --col-free: #0a2918; --col-free-text: #4dc98a;
    --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08141f; --surface: #0f2030; --surface2: #0d1b2a;
  --fg: #dce9f2; --fg-muted: #7a9db5;
  --border: #1c3347; --accent: #5badda; --accent2: #3d8fc0; --accent-light: #0f2538;
  --col-raw: #5badda; --col-raw-bg: #0e2a3f; --col-raw-pill: #143a52;
  --col-exp: #d9895a; --col-exp-bg: #2c1a0a; --col-exp-pill: #3d2410;
  --col-joe: #4dc98a; --col-joe-bg: #0a2918; --col-joe-pill: #0e3521;
  --col-free: #0a2918; --col-free-text: #4dc98a;
  --shadow-sm: 0 1px 4px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: system-ui, -apple-system, sans-serif; font-size: 14px; line-height: 1.5;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── HEADER ─────────────────────────────────── */
.site-header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  color: #fff;
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  padding: 16px max(24px, env(safe-area-inset-left, 0px));
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  box-shadow: var(--shadow-md);
}
.header-left { display: flex; flex-direction: column; gap: 1px; }
.header-brand { font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; opacity: 0.65; }
.header-title { font-size: 20px; font-weight: 800; letter-spacing: 0.01em; }
.header-actions { display: flex; gap: 10px; align-items: center; }
.btn-add {
  display: flex; align-items: center; gap: 6px;
  padding: 9px 16px; border-radius: 8px;
  border: none; background: rgba(255,255,255,0.18); color: #fff;
  font-size: 13px; font-weight: 700; cursor: pointer;
  transition: background 0.15s, transform 0.1s;
  backdrop-filter: blur(4px);
}
.btn-add:hover { background: rgba(255,255,255,0.28); transform: translateY(-1px); }
.btn-add:active { transform: translateY(0); }
.btn-add svg { width: 15px; height: 15px; }

/* Sync dot */
.sync-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.35); transition: background 0.4s; flex-shrink: 0; }
.sync-dot.live { background: #4cf87a; box-shadow: 0 0 6px #4cf87a88; animation: pulse 3s infinite; }
.sync-dot.error { background: #ff5c5c; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

/* ── LEGEND ─────────────────────────────────── */
.legend-bar {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  padding: 10px max(24px, env(safe-area-inset-left, 0px));
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.legend-item {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 600; color: var(--fg-muted);
  padding: 5px 10px; border-radius: 20px; transition: background 0.15s, color 0.15s;
}
.legend-item.clickable { cursor: pointer; }
.legend-item.clickable:hover { background: var(--accent-light); color: var(--fg); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ── STATS ──────────────────────────────────── */
.stats-bar {
  display: grid; grid-template-columns: repeat(4, 1fr);
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.stat {
  padding: 16px 12px; text-align: center;
  border-right: 1px solid var(--border);
  transition: background 0.15s;
}
.stat:last-child { border-right: none; }
.stat-num {
  font-size: 30px; font-weight: 800; line-height: 1;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; font-variant-numeric: tabular-nums;
}
.stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); margin-top: 4px; }

/* ── MAIN ───────────────────────────────────── */
.main {
  padding: 24px max(20px, env(safe-area-inset-left, 0px));
  max-width: 1140px; margin: 0 auto;
}

/* ── YEAR STRIP ─────────────────────────────── */
.year-strip {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 20px 16px;
  margin-bottom: 24px; box-shadow: var(--shadow-sm);
}
.year-strip-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--fg-muted); margin-bottom: 14px;
}
.strip-months { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.strip-month { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.strip-month-label { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--fg-muted); }
.strip-month-sub { font-size: 9px; color: var(--fg-muted); opacity: 0.8; text-align: center; }
.strip-bar {
  width: 100%; height: 42px; border-radius: 6px; cursor: pointer;
  display: flex; overflow: hidden;
  border: 1px solid var(--border);
  transition: transform 0.12s, box-shadow 0.12s;
}
.strip-bar:hover { transform: scaleY(1.08); box-shadow: var(--shadow-sm); }
.strip-seg { height: 100%; flex-shrink: 0; }

/* ── MONTH GRID ─────────────────────────────── */
.months-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.month-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); overflow: hidden;
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s, border-color 0.2s, transform 0.15s;
}
.month-card:hover { box-shadow: var(--shadow-md); border-color: var(--accent2); transform: translateY(-2px); }

.month-header {
  padding: 14px 16px 12px;
  background: linear-gradient(135deg, var(--accent-light) 0%, var(--surface2) 100%);
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}
.month-name { font-size: 15px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); }
.month-avail {
  font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 20px;
  background: var(--col-free); color: var(--col-free-text);
}
.month-avail.partial { background: var(--accent-light); color: var(--accent2); }

.cal-grid { padding: 12px 12px 8px; }
.cal-dow { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
.dow-label { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-muted); padding: 2px 0; }
.cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 500; border-radius: 6px; cursor: default;
  font-variant-numeric: tabular-nums; transition: opacity 0.1s, transform 0.1s;
}
.cal-day.empty { opacity: 0; pointer-events: none; }
.cal-day.free { background: var(--col-free); color: var(--col-free-text); font-weight: 600; }
.cal-day.booked-raw { background: var(--col-raw-bg); color: var(--col-raw); font-weight: 700; cursor: pointer; }
.cal-day.booked-exp { background: var(--col-exp-bg); color: var(--col-exp); font-weight: 700; cursor: pointer; }
.cal-day.booked-joe { background: var(--col-joe-bg); color: var(--col-joe); font-weight: 700; cursor: pointer; }
.cal-day.booked-custom { font-weight: 700; cursor: pointer; }
.cal-day[onclick]:hover { opacity: 0.75; transform: scale(1.12); }

.booking-labels { padding: 0 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.booking-pill {
  border-radius: 8px; padding: 8px 12px;
  font-size: 12.5px; font-weight: 600;
  display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  border-left: 3px solid;
}
.booking-pill:hover { opacity: 0.82; transform: translateX(2px); }
.booking-pill.raw { background: var(--col-raw-bg); color: var(--col-raw); border-color: var(--col-raw); }
.booking-pill.exp { background: var(--col-exp-bg); color: var(--col-exp); border-color: var(--col-exp); }
.booking-pill.joe { background: var(--col-joe-bg); color: var(--col-joe); border-color: var(--col-joe); }
.pill-dates { opacity: 0.7; font-size: 11px; font-weight: 500; white-space: nowrap; }

/* ── INFO PANEL ─────────────────────────────── */
.info-panel {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  right: max(20px, env(safe-area-inset-right, 0px));
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px 20px;
  box-shadow: var(--shadow-lg); max-width: 300px; z-index: 30;
  animation: slideUp 0.2s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.info-panel[hidden] { display: none !important; }
.info-color-bar { height: 4px; border-radius: 2px; margin-bottom: 14px; margin-top: -4px; }
.info-panel-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.info-panel-name { font-size: 16px; font-weight: 800; line-height: 1.2; }
.info-close {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 6px; color: var(--fg-muted);
  width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; cursor: pointer; flex-shrink: 0; transition: background 0.15s;
}
.info-close:hover { background: var(--border); }
.info-rows { display: flex; flex-direction: column; gap: 8px; }
.info-row { display: flex; gap: 8px; font-size: 13px; }
.info-row-label { font-weight: 700; color: var(--fg-muted); min-width: 46px; }
.info-row-val { color: var(--fg); }

/* ── ADD OVERLAY ────────────────────────────── */
.overlay {
  position: fixed; inset: 0; background: rgba(8,20,31,0.6);
  z-index: 40; display: flex; align-items: flex-end; justify-content: center;
  padding: 0; backdrop-filter: blur(3px);
}
.overlay[hidden] { display: none !important; }
.modal {
  background: var(--surface); border-radius: var(--radius) var(--radius) 0 0;
  padding: 28px 24px calc(28px + env(safe-area-inset-bottom, 0px));
  width: 100%; max-width: 480px;
  box-shadow: var(--shadow-lg);
  animation: slideModal 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes slideModal { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 20px; }
.modal-title { font-size: 20px; font-weight: 800; margin-bottom: 20px; }
.form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
.form-row label { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-muted); }
.form-row input {
  padding: 11px 14px; border-radius: 8px;
  border: 1.5px solid var(--border); background: var(--surface2);
  color: var(--fg); font-family: system-ui, sans-serif; font-size: 15px;
  transition: border-color 0.15s;
}
.form-row input:focus { outline: none; border-color: var(--accent2); background: var(--surface); }
.form-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions { display: flex; gap: 10px; margin-top: 24px; }
.btn-primary {
  flex: 1; background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #fff; border: none; border-radius: 10px;
  padding: 13px; font-family: system-ui, sans-serif; font-size: 15px; font-weight: 800;
  cursor: pointer; transition: opacity 0.15s, transform 0.1s;
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
.btn-ghost {
  padding: 13px 18px; background: var(--surface2); border: 1.5px solid var(--border);
  border-radius: 10px; font-family: system-ui, sans-serif; font-size: 15px;
  font-weight: 600; cursor: pointer; color: var(--fg-muted);
  transition: border-color 0.15s, color 0.15s;
}
.btn-ghost:hover { border-color: var(--accent2); color: var(--fg); }
.color-options { display: flex; gap: 10px; }
.color-opt { width: 32px; height: 32px; border-radius: 8px; border: 2.5px solid transparent; cursor: pointer; transition: transform 0.1s, border-color 0.15s; }
.color-opt:hover { transform: scale(1.1); }
.color-opt.selected { border-color: var(--fg); transform: scale(1.1); }

/* ── LOADING ────────────────────────────────── */
.loading-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 100;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; transition: opacity 0.35s;
}
.loading-overlay.hidden { opacity: 0; pointer-events: none; }
.loading-logo { font-size: 13px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-muted); }
.loading-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent2); border-radius: 50%; animation: spin 0.75s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── READONLY ───────────────────────────────── */
.readonly-notice {
  background: var(--accent-light); color: var(--accent);
  padding: 10px 24px; font-size: 12.5px; font-weight: 600;
  text-align: center; border-bottom: 1px solid var(--border);
}
.readonly-notice[hidden] { display: none !important; }

/* ── RESPONSIVE ─────────────────────────────── */
@media (max-width: 640px) {
  .header-title { font-size: 22px; }
  .header-brand { font-size: 11px; }
  .site-header { padding: 16px max(16px, env(safe-area-inset-left,0px)); }
  .btn-add { padding: 10px 18px; font-size: 15px; }

  .stats-bar { grid-template-columns: 1fr 1fr; }
  .stat { border-bottom: 1px solid var(--border); padding: 18px 10px; }
  .stat:nth-child(2n) { border-right: none; }
  .stat:nth-child(3), .stat:nth-child(4) { border-bottom: none; }
  .stat-num { font-size: 34px; }
  .stat-label { font-size: 11px; }

  .year-strip { padding: 16px 0 14px 16px; border-radius: 0; border-left: none; border-right: none; margin: 0 -16px 20px; }
  .strip-months { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; padding-right: 16px; scrollbar-width: none; }
  .strip-months::-webkit-scrollbar { display: none; }
  .strip-month { flex: 0 0 64px; }
  .strip-bar { height: 52px; }
  .strip-month-label { font-size: 11px; }
  .strip-month-sub { font-size: 10px; }

  .months-grid { grid-template-columns: 1fr; gap: 14px; }
  .main { padding: 16px max(16px, env(safe-area-inset-left,0px)); }
  .month-card:hover { transform: none; }

  .month-header { padding: 16px 18px 14px; }
  .month-name { font-size: 18px; }
  .month-avail { font-size: 13px; padding: 4px 10px; }

  .cal-grid { padding: 14px 14px 10px; }
  .dow-label { font-size: 12px; padding: 4px 0; }
  .cal-days { gap: 3px; }
  .cal-day { font-size: 15px; border-radius: 8px; }

  .booking-labels { padding: 0 14px 16px; gap: 8px; }
  .booking-pill { padding: 10px 14px; font-size: 14px; border-radius: 10px; }
  .pill-dates { font-size: 13px; }

  .legend-bar { padding: 10px max(16px, env(safe-area-inset-left,0px)); gap: 6px; }
  .legend-item { font-size: 14px; padding: 6px 12px; }
  .legend-dot { width: 12px; height: 12px; }

  .overlay { align-items: flex-end; }
  .modal { border-radius: 16px 16px 0 0; }
  .modal-title { font-size: 22px; }
  .form-row input { font-size: 16px; padding: 13px 16px; }
  .btn-primary, .btn-ghost { font-size: 16px; padding: 15px; }

  .info-panel {
    left: max(12px, env(safe-area-inset-left,0px));
    right: max(12px, env(safe-area-inset-right,0px));
    bottom: calc(12px + env(safe-area-inset-bottom,0px));
    max-width: none;
  }
  .info-panel-name { font-size: 18px; }
  .info-row { font-size: 15px; }
}
</style>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-logo">Sisak Expeditions</div>
</div>

<!-- Readonly notice -->
<div class="readonly-notice" id="readonlyNotice" hidden>
  Du kan se kalenderen — kontakt Sisak for at få redigeringsadgang
</div>

<!-- Info panel -->
<div class="info-panel" id="infoPanel" hidden>
  <div class="info-color-bar" id="infoBar"></div>
  <div class="info-panel-header">
    <div class="info-panel-name" id="infoName"></div>
    <button class="info-close" onclick="closeInfo()">×</button>
  </div>
  <div class="info-rows" id="infoBody"></div>
</div>

<!-- Add booking overlay -->
<div class="overlay" id="addOverlay" hidden>
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Tilføj booking</div>
    <div class="form-row">
      <label>Kunde / Gruppe</label>
      <input type="text" id="bookName" placeholder="Navn på kunden…" autocomplete="off">
    </div>
    <div class="form-row">
      <label>Periode</label>
      <div class="form-dates">
        <input type="date" id="bookFrom" value="2027-01-01">
        <input type="date" id="bookTo" value="2027-01-07">
      </div>
    </div>
    <div class="form-row">
      <label>Farve</label>
      <div class="color-options">
        <div class="color-opt selected" style="background:#7c3aed" onclick="pickColor(this,'#7c3aed')"></div>
        <div class="color-opt" style="background:#dc2626" onclick="pickColor(this,'#dc2626')"></div>
        <div class="color-opt" style="background:#d97706" onclick="pickColor(this,'#d97706')"></div>
        <div class="color-opt" style="background:#0891b2" onclick="pickColor(this,'#0891b2')"></div>
        <div class="color-opt" style="background:#db2777" onclick="pickColor(this,'#db2777')"></div>
      </div>
    </div>
    <div class="form-row">
      <label>Note (valgfri)</label>
      <input type="text" id="bookNote" placeholder="Antal gæster, destination…">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeAdd()">Annuller</button>
      <button class="btn-primary" id="saveBtn" onclick="saveBooking()">Gem booking</button>
    </div>
  </div>
</div>

<!-- Header -->
<header class="site-header">
  <div class="header-left">
    <div class="header-brand">Sisak Expeditions</div>
    <div class="header-title">Sejlplan 2027</div>
  </div>
  <div class="header-actions">
    <div class="sync-dot" id="syncDot" title="Forbinder…"></div>
    <button class="btn-add" id="addBtn" onclick="document.getElementById('addOverlay').hidden=false" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="8" y1="2" x2="8" y2="14"/><line x1="2" y1="8" x2="14" y2="8"/></svg>
      Booking
    </button>
  </div>
</header>

<!-- Legend -->
<div class="legend-bar">
  <div class="legend-item clickable" onclick="scrollToBooking('raw')">
    <div class="legend-dot" style="background:var(--col-raw)"></div>Raw Arctic ApS
  </div>
  <div class="legend-item clickable" onclick="scrollToBooking('exp1')">
    <div class="legend-dot" style="background:var(--col-exp)"></div>Expedition Engineering
  </div>
  <div class="legend-item clickable" onclick="scrollToBooking('joe')">
    <div class="legend-dot" style="background:var(--col-joe)"></div>Joe Chan — Ilulissat
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--col-free-text)"></div>Ledig
  </div>
</div>

<div class="stats-bar" id="statsBar"></div>

<div class="main">
  <div class="year-strip">
    <div class="year-strip-title">Årsoverblick — tryk på en måned</div>
    <div class="strip-months" id="yearStrip"></div>
  </div>
  <div class="months-grid" id="monthsGrid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://ccbkmjoerxffeqmxgbej.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjYmttam9lcnhmZmVxbXhnYmVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0MTA0NzIsImV4cCI6MjEwODk4NjQ3Mn0.t4CTwWywOLGfufUHwMMDmWiZS3TBilTWF5sDyzcN5lU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MONTHS_DA = ['Januar','Februar','Marts','April','Maj','Juni','Juli','August','September','Oktober','November','December'];
const DOW_SHORT = ['Ma','Ti','On','To','Fr','Lø','Sø'];

const DEFAULT_BOOKINGS = [
  { id: 'raw',  name: 'Raw Arctic ApS',        from: '2027-03-02', to: '2027-03-16', type: 'raw', note: 'Klient sejlads' },
  { id: 'exp1', name: 'Expedition Engineering', from: '2027-04-01', to: '2027-04-08', type: 'exp', note: '14-dages charter' },
  { id: 'exp2', name: 'Expedition Engineering', from: '2027-04-16', to: '2027-04-30', type: 'exp', note: '14-dages charter' },
  { id: 'joe',  name: 'Joe Chan — Ilulissat',   from: '2027-07-12', to: '2027-08-13', type: 'joe', note: 'Stor sommerbooking' },
];

let bookings = [...DEFAULT_BOOKINGS];
let canWrite = true;
let selectedColor = '#7c3aed';

render();
document.getElementById('addBtn').hidden = false;
document.getElementById('loadingOverlay').classList.add('hidden');

function setSyncDot(state) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot ' + state;
  const labels = { live: 'Forbundet — live sync', error: 'Ikke forbundet', '': 'Forbinder…' };
  dot.title = labels[state] || 'Forbinder…';
}

async function initDb() {
  try {
    const { data, error } = await sb.from('bookings').select('*');
    if (error) throw error;
    bookings = data.length > 0 ? data : [...DEFAULT_BOOKINGS];
    render();
    setSyncDot('live');

    sb.channel('bookings-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, async () => {
        const { data } = await sb.from('bookings').select('*');
        bookings = data.length > 0 ? data : [...DEFAULT_BOOKINGS];
        render();
      })
      .subscribe();
  } catch(e) {
    setSyncDot('error');
    canWrite = false;
    document.getElementById('addBtn').hidden = true;
    document.getElementById('readonlyNotice').hidden = false;
  }
}

// ── HELPERS ──
function parseDate(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y,m-1,d);
}
function dateKey(y,m,d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function typeColor(b) {
  if (!b) return null;
  if (b.type==='raw') return 'var(--col-raw)';
  if (b.type==='exp') return 'var(--col-exp)';
  if (b.type==='joe') return 'var(--col-joe)';
  return b.color || '#7c3aed';
}

function buildDayMap() {
  const map = {};
  for (const b of bookings) {
    const from = parseDate(b.from), to = parseDate(b.to);
    const cur = new Date(from);
    while (cur <= to) {
      const k = dateKey(cur.getFullYear(), cur.getMonth()+1, cur.getDate());
      map[k] = b;
      cur.setDate(cur.getDate()+1);
    }
  }
  return map;
}

// ── STATS ──
function renderStats() {
  const dayMap = buildDayMap();
  const booked = Object.keys(dayMap).filter(k=>k.startsWith('2027')).length;
  const total = 365, free = total - booked;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="stat-num">${booked}</div><div class="stat-label">Dage booket</div></div>
    <div class="stat"><div class="stat-num">${free}</div><div class="stat-label">Dage ledige</div></div>
    <div class="stat"><div class="stat-num">${bookings.length}</div><div class="stat-label">Perioder</div></div>
    <div class="stat"><div class="stat-num">${Math.round(booked/total*100)}%</div><div class="stat-label">Belægning</div></div>
  `;
}

// ── YEAR STRIP ──
function renderYearStrip() {
  const dayMap = buildDayMap();
  const strip = document.getElementById('yearStrip');
  strip.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const days = new Date(2027, m, 0).getDate();
    const segs = [];
    let cur = null;
    for (let d = 1; d <= days; d++) {
      const b = dayMap[dateKey(2027,m,d)];
      const type = b ? (b.type||'custom') : 'free';
      const key = b ? b.id : 'free';
      if (!cur || cur.key !== key) { cur={type, key, color: b?.color, count:1}; segs.push(cur); }
      else cur.count++;
    }
    const colorFor = s => {
      if (s.type==='raw') return 'var(--col-raw)';
      if (s.type==='exp') return 'var(--col-exp)';
      if (s.type==='joe') return 'var(--col-joe)';
      if (s.type==='free') return 'var(--border)';
      return s.color||'#7c3aed';
    };
    const bookedCount = segs.filter(s=>s.type!=='free').reduce((a,s)=>a+s.count,0);
    const subLabel = bookedCount > 0 ? `${bookedCount}d` : '✓';
    const el = document.createElement('div');
    el.className = 'strip-month';
    el.innerHTML = `
      <div class="strip-month-label">${MONTHS_DA[m-1].slice(0,3)}</div>
      <div class="strip-bar" title="${MONTHS_DA[m-1]}: ${bookedCount > 0 ? bookedCount+' dage booket' : 'Helt ledig'}" onclick="scrollToMonth(${m})">
        ${segs.map(s=>`<div class="strip-seg" style="width:${(s.count/days*100).toFixed(1)}%;background:${colorFor(s)}"></div>`).join('')}
      </div>
      <div class="strip-month-sub">${subLabel}</div>`;
    strip.appendChild(el);
  }
}

function scrollToMonth(m) {
  document.getElementById(`month-${m}`)?.scrollIntoView({behavior:'smooth',block:'start'});
}
function scrollToBooking(id) {
  const b = bookings.find(x=>x.id===id);
  if (!b) return;
  const m = parseDate(b.from).getMonth()+1;
  const el = document.getElementById(`month-${m}`);
  if (el) {
    el.scrollIntoView({behavior:'smooth',block:'start'});
    el.style.transition = 'box-shadow 0.2s';
    el.style.boxShadow = `0 0 0 3px var(--accent2)`;
    setTimeout(()=>{ el.style.boxShadow=''; }, 1500);
    showInfo(id);
  }
}

// ── MONTH CARDS ──
function renderMonths() {
  const dayMap = buildDayMap();
  const grid = document.getElementById('monthsGrid');
  grid.innerHTML = '';
  for (let m = 1; m <= 12; m++) {
    const totalDays = new Date(2027, m, 0).getDate();
    const firstDow = (new Date(2027, m-1, 1).getDay() + 6) % 7;
    let freeDays = 0;
    for (let d = 1; d <= totalDays; d++) if (!dayMap[dateKey(2027,m,d)]) freeDays++;

    const monthBookings = bookings.filter(b => {
      const f=parseDate(b.from), t=parseDate(b.to);
      const ms=new Date(2027,m-1,1), me=new Date(2027,m,0);
      return f<=me && t>=ms;
    });

    let dayCells = '';
    for (let i=0; i<firstDow; i++) dayCells += `<div class="cal-day empty"></div>`;
    for (let d=1; d<=totalDays; d++) {
      const k = dateKey(2027,m,d);
      const b = dayMap[k];
      let cls, style='', onclick='';
      if (!b) { cls='free'; }
      else if (['raw','exp','joe'].includes(b.type)) {
        cls=`booked-${b.type}`; onclick=`onclick="showInfo('${b.id}')"`;
      } else {
        cls='booked-custom';
        style=`style="background:${b.color}22;color:${b.color}"`;
        onclick=`onclick="showInfo('${b.id}')"`;
      }
      dayCells += `<div class="cal-day ${cls}" ${onclick} ${style} title="${b?b.name:''}">${d}</div>`;
    }

    const pillsHtml = monthBookings.map(b => {
      const f=parseDate(b.from), t=parseDate(b.to);
      const ms=new Date(2027,m-1,1), me=new Date(2027,m,0);
      const sf=f<ms?ms:f, st=t>me?me:t;
      const fmt=d=>`${d.getDate()}/${d.getMonth()+1}`;
      const isBuiltin=['raw','exp','joe'].includes(b.type);
      const cls=isBuiltin?b.type:'';
      const sty=isBuiltin?'':`style="background:${b.color}18;color:${b.color};border-color:${b.color}"`;
      return `<div class="booking-pill ${cls}" ${sty} onclick="showInfo('${b.id}')">
        <span>${b.name}</span><span class="pill-dates">${fmt(sf)} – ${fmt(st)}</span>
      </div>`;
    }).join('');

    const isAllFree = freeDays===totalDays;
    const availCls = isAllFree ? '' : 'partial';
    const availTxt = isAllFree ? '✓ Helt ledig' : `${freeDays} dage ledige`;

    const card = document.createElement('div');
    card.className='month-card'; card.id=`month-${m}`;
    card.innerHTML=`
      <div class="month-header">
        <div class="month-name">${MONTHS_DA[m-1]}</div>
        <div class="month-avail ${availCls}">${availTxt}</div>
      </div>
      <div class="cal-grid">
        <div class="cal-dow">${DOW_SHORT.map(d=>`<div class="dow-label">${d}</div>`).join('')}</div>
        <div class="cal-days">${dayCells}</div>
      </div>
      ${monthBookings.length?`<div class="booking-labels">${pillsHtml}</div>`:''}`;
    grid.appendChild(card);
  }
}

// ── INFO PANEL ──
function showInfo(id) {
  const b = bookings.find(x=>x.id===id);
  if (!b) return;
  const from=parseDate(b.from), to=parseDate(b.to);
  const days=Math.round((to-from)/864e5)+1;
  const fmt=d=>`${d.getDate()}. ${MONTHS_DA[d.getMonth()].toLowerCase()} ${d.getFullYear()}`;
  const isCustom=!['raw','exp','joe'].includes(b.type);
  const color=typeColor(b);

  document.getElementById('infoBar').style.background=color;
  document.getElementById('infoName').textContent=b.name;
  document.getElementById('infoBody').innerHTML=`
    <div class="info-row"><span class="info-row-label">Fra</span><span class="info-row-val">${fmt(from)}</span></div>
    <div class="info-row"><span class="info-row-label">Til</span><span class="info-row-val">${fmt(to)}</span></div>
    <div class="info-row"><span class="info-row-label">Dage</span><span class="info-row-val">${days} dage</span></div>
    ${b.note?`<div class="info-row"><span class="info-row-label">Note</span><span class="info-row-val">${b.note}</span></div>`:''}
    ${isCustom&&canWrite?`<div style="margin-top:12px"><button class="btn-ghost" style="font-size:13px;padding:8px 14px;color:#dc2626;border-color:#dc2626;border-radius:8px" onclick="deleteBooking('${b.id}')">Slet booking</button></div>`:''}
  `;
  document.getElementById('infoPanel').hidden=false;
}
function closeInfo() { document.getElementById('infoPanel').hidden=true; }

// ── ADD / DELETE ──
function pickColor(el,col) {
  document.querySelectorAll('.color-opt').forEach(e=>e.classList.remove('selected'));
  el.classList.add('selected'); selectedColor=col;
}
function closeAdd() { document.getElementById('addOverlay').hidden=true; }

async function saveBooking() {
  if (!canWrite) return;
  const name=document.getElementById('bookName').value.trim();
  const from=document.getElementById('bookFrom').value;
  const to=document.getElementById('bookTo').value;
  const note=document.getElementById('bookNote').value.trim();
  if (!name||!from||!to||from>to) return;
  const btn=document.getElementById('saveBtn');
  btn.textContent='Gemmer…'; btn.disabled=true;
  try {
    const id='custom_'+Date.now();
    const {error}=await sb.from('bookings').insert({id,name,from,to,type:'custom',color:selectedColor,note});
    if (error) throw error;
    closeAdd();
    document.getElementById('bookName').value='';
    document.getElementById('bookNote').value='';
  } catch(e) { alert('Kunne ikke gemme — prøv igen'); }
  finally { btn.textContent='Gem booking'; btn.disabled=false; }
}

async function deleteBooking(id) {
  if (!canWrite) return;
  closeInfo();
  try {
    const {error}=await sb.from('bookings').delete().eq('id',id);
    if (error) throw error;
  } catch(e) { alert('Kunne ikke slette'); }
}

// ── RENDER ──
function render() { renderStats(); renderYearStrip(); renderMonths(); }

document.addEventListener('click', e => {
  const p=document.getElementById('infoPanel');
  if (!p.hidden && !p.contains(e.target) && !e.target.closest('[onclick^="showInfo"],.booking-pill')) closeInfo();
});
document.getElementById('addOverlay').addEventListener('click', e=>{
  if (e.target===document.getElementById('addOverlay')) closeAdd();
});

initDb();
</script>
